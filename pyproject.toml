[project]
name = "mynames"
version = "0.1.0"
description = "This bot was created to record the various sweet names my boyfriend calls me"
authors = [
    {name = "Sofiia Kuzmenko",email = "kuzmenkosofi@gmail.com"}
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "yoyo-migrations (>=9.0.0,<10.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
